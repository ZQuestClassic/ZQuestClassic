run-name: ${{ inputs.release-tag || 'Build' }}, ${{ inputs.runs-on }} ${{ inputs.arch }} ${{ inputs.config }} w/ ${{ inputs.compiler }}

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
      arch:
        type: string
      compiler:
        type: string
        required: false
      config:
        type: string
        default: "Release"
        required: true
      cache:
        type: boolean
        default: true
      debug-info:
        type: boolean
        default: false
        description: "Whether to include debug info in the packaged artifact"
      # The following is for releases only.
      official:
        type: boolean
        default: false
        description: "Do not set this directly! Use release workflow."
      sentry:
        type: boolean
        default: false
        description: "Do not set this directly! Use release workflow."
      release-tag:
        type: string
        required: false
        description: "Do not set this directly! Use release workflow."
      release-name:
        type: string
        required: false
        description: "Do not set this directly! Use release workflow."
      number:
        description: Version number (Alpha/Beta/Gamma/Release).
        type: string
        required: false
      versiontype:
        type: string
        description: Whether the build specified is an Alpha/Beta/Gamma/Release
        required: false
      full_release:
        type: boolean
        description: Full Version (i.e. NOT a nightly)
        required: false
      prerelease:
        type: boolean
        default: false
        description: Sets ZC_IS_PRERELEASE to 1
    outputs:
      artifact-name:
        description: "The name of the artifact that should be downloaded by the caller workflow"
        value: build-${{ inputs.runs-on }}-${{ inputs.arch }}-${{ inputs.compiler }}-${{ inputs.config }}
      package-name:
        description: "The name of the package inside the uploaded artifact"
        value: ${{ jobs.build.outputs.package-name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      package-name: ${{ steps.set-package-vars.outputs.package-name }}
    steps:
      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: '3.31.10'

      - name: git clone
        uses: connorjclark/action-cached-lfs-checkout@3ea4dc59b06f3baa8c01ba891fbfc2dbfdce5bc8
        with:
          include: 'resources/**/*'
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.4'
          # Many pinned packages have no Windows arm64 wheels; x64 Python runs
          # under emulation there (the binaries being built/tested stay native).
          architecture: ${{ (runner.os == 'Windows' && runner.arch == 'ARM64') && 'x64' || '' }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - if: ${{ contains(inputs.runs-on, 'windows') }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ inputs.arch }}

      - name: Install LLVM and Clang
        if: inputs.compiler == 'clang' && runner.os == 'Linux' && runner.arch == 'X64'
        uses: KyleMayes/install-llvm-action@1a3da29f56261a1e1f937ec88f0856a9b8321d7e # v1
        with:
          version: 17.0.2
          env: true
      # install-llvm-action@v1 only knows x86-64 Linux assets, so on arm64 it
      # installs an x86-64 clang (Exec format error). Fetch the matching
      # aarch64 release directly.
      - name: Install LLVM and Clang (Linux arm64)
        if: inputs.compiler == 'clang' && runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          curl -sL -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.2/clang+llvm-17.0.2-aarch64-linux-gnu.tar.xz
          mkdir -p "$GITHUB_WORKSPACE/llvm"
          tar -xf llvm.tar.xz -C "$GITHUB_WORKSPACE/llvm" --strip-components=1
          rm llvm.tar.xz
          # The llvm.org binaries link against libtinfo5.
          sudo apt-get install -y libtinfo5 || true
          echo "$GITHUB_WORKSPACE/llvm/bin" >> $GITHUB_PATH
          echo "CC=$GITHUB_WORKSPACE/llvm/bin/clang" >> $GITHUB_ENV
          echo "CXX=$GITHUB_WORKSPACE/llvm/bin/clang++" >> $GITHUB_ENV
          "$GITHUB_WORKSPACE/llvm/bin/clang" --version
      - if: ${{ contains(inputs.runs-on, 'windows') }}
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: 120deac3062162151622ca4860575a33844ba10b

      # Packages vcpkg built (see install-deps in ci.py). Their hashes include the
      # compiler, so the key does too.
      - name: Restore vcpkg packages
        if: ${{ contains(inputs.runs-on, 'windows') }}
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ inputs.runs-on }}-${{ inputs.arch }}-120deac3062162151622ca4860575a33844ba10b-${{ env.VCToolsVersion }}

      - name: Install OS Dependencies
        run: >
          python .github/workflows/ci.py install-deps
          --repo ${{ github.repository }}
          --arch ${{ inputs.arch }}
          --compiler ${{ inputs.compiler }}

      # Setup build cache via ccache.
      - name: ccache cache files
        if: inputs.cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ${{ inputs.runs-on }}-${{ inputs.arch }}-${{ inputs.compiler }}-${{ inputs.config }}-ccache-${{ github.run_id }}
          restore-keys: ${{ inputs.runs-on }}-${{ inputs.arch }}-${{ inputs.compiler }}-${{ inputs.config }}-

      - name: Build ZScript docs
        if: ${{ inputs.release-tag }}
        run: |
          pip install pytz
          python webdocs/docjson_main.py --in webdocs/zsdocs_main.json --out resources/docs/ZScript_Docs.html -c

      # Empty arguments are passed with bash syntax; Windows defaults to PowerShell.
      - name: Build
        shell: bash
        run: >
          python -Xutf8 .github/workflows/ci.py build
          --arch ${{ inputs.arch }}
          --compiler ${{ inputs.compiler }}
          --config ${{ inputs.config }}
          --release-tag "${{ inputs.release-tag }}"
          --repo "${{ github.repository }}"
          ${{ inputs.official && '--official' || '' }}
          ${{ inputs.sentry && '--sentry' || '' }}
          ${{ !inputs.cache && '--no-cache' || '' }}
          ${{ inputs.versiontype && format('--versiontype {0}', inputs.versiontype) || '' }}
          ${{ inputs.number && format('--number {0}', inputs.number) || '' }}
          ${{ inputs.full_release && '--full-release' || '' }}
          ${{ inputs.prerelease && '--prerelease' || '' }}

      - name: Package
        shell: bash
        run: >
          python -Xutf8 .github/workflows/ci.py package
          --repo ${{ github.repository }}
          --arch ${{ inputs.arch }}
          --config ${{ inputs.config }}
          --release-tag "${{ inputs.release-tag }}"
          --packages-dir packages
          ${{ inputs.debug-info && '--debug-info' || '' }}

      - name: Set package output variable
        id: set-package-vars
        shell: bash
        run: |
          # Grab the name of the file the script put in the packages directory,
          # excluding build.tar.gz if it exists
          PACKAGE_NAME=$(ls packages/ | grep -v build.tar.gz | head -n 1)
          echo "package-name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

      # Make build result available to other workflows.
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ inputs.runs-on }}-${{ inputs.arch }}-${{ inputs.compiler }}-${{ inputs.config }}
          path: packages/*.*

      # Upload debug symbols to Sentry.
      - name: Setup Sentry CLI
        if: inputs.sentry
        uses: mathieu-bour/setup-sentry-cli@ff4fff773f5e628fa214ebd19e46fb7289454ee2 # v3.0.0
        with:
          version: '2.58.6'
          token: ${{ secrets.SENTRY_TOKEN }}
          organization: zeldaclassic
          project: zelda-classic
      - run: sentry-cli --version
        if: inputs.sentry
      - name: Upload debugging symbols
        if: inputs.sentry
        run: sentry-cli --log-level=DEBUG upload-dif 'zelda-classic@${{ inputs.release-tag }}' --include-sources --wait build/${{ inputs.config }}
