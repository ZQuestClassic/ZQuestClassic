name: compare

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  compare:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    # The compare tooling reads the failing run's artifacts, finds the PR it
    # was for, creates a ref for the baseline commit, and starts (and reruns)
    # a test.yml run there.
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      # This checks out the default branch (main) regardless of which branch
      # the failing CI run was for - that is where the compare tooling lives.
      # The baseline run itself is dispatched on the failing run's branch (see
      # run_test_workflow.py), so nothing here may depend on this checkout
      # matching that branch's layout.
      - name: git clone
        uses: actions/checkout@v7
        with:
          # Need history to find baseline commit.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup Node.js (for Surge)
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Generate compare report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          REPLAY_FAILURE_DISCORD_WEBHOOK: ${{ secrets.REPLAY_FAILURE_DISCORD_WEBHOOK }}
          # The branch name comes from the triggering run, which may be from a
          # fork, so it must not be pasted into the script.
          REF_NAME: ${{ github.event.workflow_run.head_branch }}
          ACTOR: ${{ github.actor }}
        run: >
          bash .github/workflows/run_python.sh .github/workflows/ci.py compare-replays
          --repo ${{ github.repository }}
          --run-id ${{ github.event.workflow_run.id }}
          --ref-name "$REF_NAME"
          --actor "$ACTOR"

      # Upload as artifact, so that if publishing to surge fails the report is still accessible.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report
          path: ${{ github.workspace }}/tests/compare-report
