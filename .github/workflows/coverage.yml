name: Code Coverage

on:
  workflow_dispatch:
  # Weekly (Monday 06:00 UTC), skipped if src/ and tests/ haven't changed
  # since the last successful run.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  check-changes:
    runs-on: ubuntu-latest
    if: github.repository == 'ZQuestClassic/ZQuestClassic'
    permissions:
      contents: read
      actions: read
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: git clone
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "Manually triggered, running."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow coverage.yml \
            --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [[ -z "$last_sha" ]] || ! git cat-file -e "$last_sha^{commit}" 2>/dev/null; then
            echo "No usable previous successful run ('$last_sha'), running."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$last_sha" HEAD -- src tests; then
            echo "No changes to src/ or tests/ since $last_sha, skipping."
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "src/ or tests/ changed since $last_sha, running."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  # Get the LFS cache ready. This avoids every shard of each environment downloading the LFS objects
  # at the same time on any change, which is bad for quota.
  warm-lfs-cache:
    needs: check-changes
    if: needs.check-changes.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: git clone
        uses: connorjclark/action-cached-lfs-checkout@f082d118c76ebb8e100c35719e76b86866146f9d
        with:
          enableCrossOsArchive: true

  collect-coverage:
    needs: warm-lfs-cache
    uses: ./.github/workflows/test.yml
    with:
      runs-on: ubuntu-22.04
      arch: x64
      compiler: clang
      config: Coverage
      # TODO yuurand.zplay rng desyncs on frame 449856, because Debug mode.
      extra-args: --replay --frame=yuurand.zplay=449855
      from-ci-workflow: true
    secrets:
      GH_PAT_ZSCRIPT_DATABASE: ${{ secrets.GH_PAT_ZSCRIPT_DATABASE }}

  upload-coverage:
    needs: ["collect-coverage"]
    runs-on: ubuntu-22.04
    # Pushes the report to the gh-pages branch.
    permissions:
      contents: write

    steps:
      - name: git clone
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v8
        with:
          path: coverage-json

      - run: cp -r coverage-json/generated-source-files/* src/

      - name: Generate coverage report
        run: bash tests/generate_coverage_report.sh --add-tracefile "coverage-json/**/coverage.json"
        env:
          GCOV: llvm-cov-14 gcov

      - name: Install Node.js 18.x
        uses: actions/setup-node@v7
        with:
          node-version: 18.x
      - run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          mkdir tmp
          npx gh-pages --dist tests/.coverage/report --dest coverage -u "github-actions-bot <support+actions@github.com>"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # https://github.com/tschaub/gh-pages/issues/354
          CACHE_DIR: tmp
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html-report
          path: ${{ github.workspace }}/tests/.coverage/report/
